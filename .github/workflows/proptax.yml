# Refresh the per-state property tax table from the Census Bureau, quarterly,
# and open a pull request if anything moved.
#
# WHY THIS RUNS HERE AND NOT SOMEWHERE ELSE
#
# The environment this workflow was written in has no route to api.census.gov,
# or to any other government data host — network egress there is limited to a
# small allowlist that doesn't include it. That is a property of that one
# environment, not of the data: it is public, government-published and
# requires no API key. A GitHub Actions runner has ordinary outbound internet,
# so the fetch that couldn't run in the authoring session runs fine here.
#
# WHAT IT DOES
#
# Runs scripts/fetch-proptax.mjs, which pulls two ACS tables (median real
# estate tax paid, median home value) for every state and computes the
# effective rate. If assets/js/proptax.generated.js comes out different, it
# opens a PR with the diff and a description of what changed; a human reviews
# and merges it like any other change to the numbers this page shows. It never
# pushes straight to main — a property tax figure is a real claim about
# someone's money, and an automated job with no ceiling on how wrong a fetch
# could go should not be the last check on that.
#
# TO RUN IT NOW rather than waiting for the schedule:
#   gh workflow run proptax.yml
# or use the "Run workflow" button on this workflow in the Actions tab.

name: Refresh property tax rates

on:
  schedule:
    # 06:00 UTC on the 2nd of January, April, July and October — a few days
    # after each quarter turns over, so a just-published ACS release has time
    # to actually be live before this asks for it.
    - cron: '0 6 2 1,4,7,10 *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  refresh:
    name: Fetch and compare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch the current ACS figures
        run: node scripts/fetch-proptax.mjs

      - name: Check whether anything changed
        id: diff
        run: |
          if git diff --quiet -- assets/js/proptax.generated.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the tests against the new figures
        if: steps.diff.outputs.changed == 'true'
        run: npm test

      - name: Open a pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Refresh property tax rates from the Census Bureau"
          title: "Quarterly property tax refresh"
          # The diff itself is the record of what moved; this just orients a
          # reviewer, and links back to why the number is what it is.
          body: |
            Automated refresh of `assets/js/proptax.generated.js` from the Census
            Bureau's American Community Survey — see `scripts/fetch-proptax.mjs`
            for the exact method (median real estate tax paid ÷ median home
            value, owner-occupied units).

            **Before merging:**
            - Skim the diff for anything that moved by more than a point or two
              — real, but worth a second look before it changes what the page
              tells someone they can afford.
            - `assets/js/proptax-adjust.js` is untouched by this PR on purpose:
              it's the hand-maintained buyer-vs-owner correction for California
              and Texas, and a change to *it* is a policy judgement, not a data
              refresh. If this PR's numbers suggest another state needs the same
              treatment, that's a follow-up PR to that file, reasoned through
              and cited — not something to wave through here.
            - CI has already run the test suite against these figures as part of
              this workflow; a red check here means something is actually wrong,
              not a flake to re-run past.

            🤖 Generated by the quarterly `proptax.yml` workflow.
          branch: auto/proptax-refresh
          delete-branch: true
          labels: automated,data-refresh
